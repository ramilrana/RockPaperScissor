<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="index.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Rock Paper Scissor</title>
  </head>
  <body>
    <header>
      <div class="headerTitle">
        <p id="rps">
          <span class="rpsText">R</span>OCK <span class="rpsText">P</span>APER
          <span class="rpsText">S</span>CISSOR
        </p>
      </div>
    </header>

    <main>
      <div id="leftSide">
        <!-- <button id="back">Back to home</button> -->
        <div id="insideLeft">
          <div class="pointDiv">
            <h3>Total Points:</h3>
            <hr class="insideBox" />
            <div id="points">
              <div>
                <ul>
                  <li><span>HUMAN:</span></li>
                  <li>
                    <span>COMPUTER:</span>
                  </li>
                  <li><span>DRAW:</span></li>
                </ul>
              </div>
              <div>
                <ul>
                  <li><span id="humanScore"></span></li>
                  <li>
                    <span id="computerScore"></span>
                  </li>
                  <li><span id="drawScore"></span></li>
                </ul>
              </div>
            </div>
          </div>

          <div class="pointDiv" id="scoreSummary">
            <h3>Game Summary:</h3>
            <br />
            <p id="totalRounds">Rounds:</p>
            <hr class="insideBox" />
            <div id="summary">
              <ul id="gameSummary"></ul>
            </div>
          </div>
        </div>
      </div>
      <div id="rightSide">
        <div id="handShow">
          <div id="playerPick">
            <h2>You</h2>
            <div id="pFrame">
              <img
                src="assets/paper.png"
                alt="paper emoji"
                class="rpsImage"
                id="pPaper"
                hidden
              />
              <img
                src="assets/rock.png"
                alt="rock emoji"
                class="rpsImage"
                id="pRock"
                hidden
              />
              <img
                src="assets/scissor.png"
                alt="scissor emoji"
                class="rpsImage"
                id="pScissor"
                hidden
              />
            </div>
            <input type="text" id="pText" class="textInputPick" disabled />
          </div>
          <div id="separator"><p id="versus">VS</p></div>
          <div id="computerPick">
            <h2>Computer</h2>
            <div id="cFrame">
              <img
                src="assets/paper.png"
                alt="paper emoji"
                class="rpsImage"
                id="cPaper"
                hidden
              />
              <img
                src="assets/rock.png"
                alt="rock emoji"
                class="rpsImage"
                id="cRock"
                hidden
              />
              <img
                src="assets/scissor.png"
                alt="scissor emoji"
                class="rpsImage"
                id="cScissor"
                hidden
              />
            </div>
            <input type="text" id="cText" class="textInputPick" disabled />
          </div>
        </div>
        <div id="start">
          <div>
            <label for="rounds">SELECT NUMBER OF ROUNDS: &nbsp;</label>
            <select name="rounds" id="rounds">
              <option value="" disabled selected>--Please select--</option>
              <option value="1">1</option>
              <option value="3">3</option>
              <option value="5">5</option>
            </select>
          </div>
          <button id="startGame" class="startBTN toDisable">Start</button>
          <button id="resetGame" class="resetBTN">Reset</button>
        </div>
        <div id="buttonGroup">
          <button
            class="rpsBTN toDisable"
            id="rockPick"
            onclick="playerPick(this)"
          >
            ROCK
          </button>
          <button
            class="rpsBTN toDisable"
            id="paperPick"
            onclick="playerPick(this)"
          >
            PAPER
          </button>
          <button
            class="rpsBTN toDisable"
            id="scissorPick"
            onclick="playerPick(this)"
          >
            SCISSOR
          </button>
        </div>
      </div>
    </main>

    <footer>
      <div id="footerDiv">
        <p>@ Amanob 2024</p>
      </div>
    </footer>
  </body>
</html>

<script src="rps-page.js" defer></script>
<script src="sweet-alert.js" defer></script>
